! TVI - Hanoi Branch Router (starter template)
hostname R-HN
no ip domain-lookup
!
interface Loopback0
 description Router ID
 ip address 10.20.255.1 255.255.255.255
!
! Planned HQ transit: 10.255.0.2/30; HQ endpoint: 10.255.0.1/30.
! TODO: Assign to the actual WAN interface after port mapping.
!
router ospf 10
 router-id 10.20.255.1
 passive-interface default
! TODO: Enable OSPF only on the HQ transit and approved routed VLAN interfaces.
! TODO: Configure DHCP relay on client VLAN gateways after DHCP scope finalization.
!
! TODO: Add branch VLAN gateways, ACLs, DHCP relay and IPv6 routing as supported.
ip domain-name tvi.example
username netadmin privilege 15 secret <SET_SECURE_SECRET>
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
end
