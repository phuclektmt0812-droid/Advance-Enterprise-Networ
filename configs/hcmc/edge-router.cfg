! TVI - HCMC Edge Router (starter template)
! Platform assumption: Cisco IOS/IOS-XE router.
! Interfaces are intentionally not guessed; map them to the actual GNS3/CML nodes.
hostname R-HQ
no ip domain-lookup
!
interface Loopback0
 description Router ID
 ip address 10.10.255.1 255.255.255.255
!
! Planned transit to core: 10.10.254.0/30
! R-HQ address: 10.10.254.1; Core address: 10.10.254.2
! TODO: Apply 10.10.254.1/30 to the actual core-facing interface.
!
! Planned HQ-Hanoi WAN: 10.255.0.0/30
! R-HQ 10.255.0.1; R-HN 10.255.0.2
! Planned HQ-Da Nang WAN: 10.255.0.4/30
! R-HQ 10.255.0.5; R-DN 10.255.0.6
! TODO: Assign these addresses to actual routed WAN interfaces.
!
! Documentation-only ISP test link: 203.0.113.0/30 (TEST-NET-3).
! R-HQ 203.0.113.1; ISP 203.0.113.2. Not a real public allocation.
! TODO: Configure ISP-facing interface and eBGP only in isolated lab.
!
router ospf 10
 router-id 10.10.255.1
 passive-interface default
! TODO: Add no passive-interface for actual routed adjacencies.
! TODO: Add network statements after interface addressing is finalized.
!
router bgp 65010
 bgp log-neighbor-changes
! TODO: Configure neighbor 203.0.113.2 remote-as 65000 after ISP link exists.
! TODO: Add explicit prefix filters; do not advertise internal routes indiscriminately.
!
! TODO: Add NAT/PAT only after inside/outside interface mapping and ACL review.
! TODO: Add IPsec only after peer addresses, protected subnets and crypto profile are agreed.
!
ip domain-name tvi.example
username netadmin privilege 15 secret <SET_SECURE_SECRET>
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
end
