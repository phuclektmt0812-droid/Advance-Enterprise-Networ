! TVI - HCMC Distribution Switch 1 (starter template)
! Platform assumption: Cisco IOS/IOS-XE. Confirm commands on the selected switch image.
hostname SW-HQ-A1
no ip domain-lookup
!
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name SERVER
vlan 50
 name GUEST
vlan 60
 name IOT
vlan 70
 name VOICE
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
interface Vlan99
 description Management SVI - proposed address
 ip address 10.10.99.3 255.255.255.0
 no shutdown
!
! TODO: Configure uplinks as LACP EtherChannels after port mapping.
! TODO: Configure trunks with an explicit allowed VLAN list.
! TODO: Set primary/secondary STP root priorities according to final topology.
! TODO: Add access ports and Port Security after endpoint mapping.
! TODO: Configure default gateway 10.10.99.2 if this is a Layer 2 switch.
!
ip domain-name tvi.example
username netadmin privilege 15 secret <SET_SECURE_SECRET>
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
end
