hostname SPINE2
ip routing
interface Loopback0
   ip address 10.40.250.2/32
   ip ospf area 0.0.0.0
interface Ethernet1
   no switchport
   ip address 10.40.0.2/31
   ip ospf area 0.0.0.0
   no shutdown
interface Ethernet2
   no switchport
   ip address 10.40.0.6/31
   ip ospf area 0.0.0.0
   no shutdown
router ospf 100
   router-id 10.40.250.2
   passive-interface Loopback0
router bgp 65140
   router-id 10.40.250.2
   neighbor LEAVES peer group
   neighbor LEAVES remote-as 65140
   neighbor LEAVES update-source Loopback0
   neighbor LEAVES send-community extended
   neighbor 10.40.250.11 peer group LEAVES
   neighbor 10.40.250.12 peer group LEAVES
   address-family evpn
      neighbor LEAVES activate
      neighbor LEAVES route-reflector-client
