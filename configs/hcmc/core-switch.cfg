! TVI - HCMC Core Switch (starter template)
! Platform assumption: Cisco IOS/IOS-XE L3 switch. Verify exact syntax on selected image.
! Address plan: management 10.10.99.2; routed transit 10.10.254.2/30.
! Physical interfaces intentionally omitted until the port map is approved.
hostname SW-HQ-Core
no ip domain-lookup
ip routing
!
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name SERVER
vlan 50
 name GUEST
vlan 60
 name IOT
vlan 70
 name VOICE
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
interface Vlan99
 description Management SVI - verify subnet/gateway before enabling
 ip address 10.10.99.2 255.255.255.0
 no shutdown
!
! TODO: Configure SVIs only after VLSM and gateway redundancy plan are finalized.
! TODO: Configure routed uplink to R-HQ using the approved physical interface.
! Planned transit: 10.10.254.2/30; R-HQ: 10.10.254.1/30.
! TODO: Add OSPF process 10 after all routed interfaces and networks are confirmed.
! TODO: Add LACP port-channels and trunks after physical port mapping.
!
ip domain-name tvi.example
username netadmin privilege 15 secret <SET_SECURE_SECRET>
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh
!
end
