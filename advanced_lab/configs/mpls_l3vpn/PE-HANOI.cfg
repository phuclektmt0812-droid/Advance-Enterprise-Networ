hostname PE-HANOI
ip cef
mpls label protocol ldp
mpls ldp router-id Loopback0 force
ip vrf TVI_ENTERPRISE
 rd 65141:12
 route-target import 65141:100
 route-target export 65141:100
interface Loopback0
 ip address 10.41.250.12 255.255.255.255
interface GigabitEthernet0/0
 description TO_P2
 ip address 10.41.0.5 255.255.255.254
 mpls ip
 no shutdown
interface GigabitEthernet0/1
 description CUSTOMER_CE_HANOI
 ip vrf forwarding TVI_ENTERPRISE
 ip address 10.43.0.5 255.255.255.252
 no shutdown
router ospf 41
 router-id 10.41.250.12
 network 10.41.0.0 0.0.255.255 area 0
 network 10.41.250.12 0.0.0.0 area 0
router bgp 65141
 bgp log-neighbor-changes
 neighbor 10.41.250.11 remote-as 65141
 neighbor 10.41.250.11 update-source Loopback0
 neighbor 10.41.250.13 remote-as 65141
 neighbor 10.41.250.13 update-source Loopback0
 neighbor 10.43.0.6 remote-as 65020
 address-family vpnv4
  neighbor 10.41.250.11 activate
  neighbor 10.41.250.11 send-community extended
  neighbor 10.41.250.13 activate
  neighbor 10.41.250.13 send-community extended
 exit-address-family
 address-family ipv4 vrf TVI_ENTERPRISE
  neighbor 10.43.0.6 activate
 exit-address-family
