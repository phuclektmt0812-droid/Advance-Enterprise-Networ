hostname LEAF1
ip routing
vlan 110
   name CORP_APP
vlan 120
   name CORP_DB
vlan 150
   name GUEST
interface Loopback0
   ip address 10.40.250.11/32
   ip ospf area 0.0.0.0
interface Ethernet1
   no switchport
   ip address 10.40.0.1/31
   ip ospf area 0.0.0.0
   no shutdown
interface Ethernet2
   no switchport
   ip address 10.40.0.3/31
   ip ospf area 0.0.0.0
   no shutdown
interface Ethernet3
   description HOST_APP_VLAN110
   switchport access vlan 110
   spanning-tree portfast
   no shutdown
interface Ethernet4
   description HOST_DB_VLAN120
   switchport access vlan 120
   spanning-tree portfast
   no shutdown
interface Ethernet5
   description HOST_GUEST_VLAN150
   switchport access vlan 150
   spanning-tree portfast
   no shutdown
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   no shutdown
   vxlan vlan 110 vni 10110
   vxlan vlan 120 vni 10120
   vxlan vlan 150 vni 10150
router ospf 100
   router-id 10.40.250.11
   passive-interface Loopback0
router bgp 65140
   router-id 10.40.250.11
   neighbor SPINES peer group
   neighbor SPINES remote-as 65140
   neighbor SPINES update-source Loopback0
   neighbor SPINES send-community extended
   neighbor 10.40.250.1 peer group SPINES
   neighbor 10.40.250.2 peer group SPINES
   vlan 110
      rd 10.40.250.11:10110
      route-target both 10110:10110
      redistribute learned
   vlan 120
      rd 10.40.250.11:10120
      route-target both 10120:10120
      redistribute learned
   vlan 150
      rd 10.40.250.11:10150
      route-target both 10150:10150
      redistribute learned
   address-family evpn
      neighbor SPINES activate
